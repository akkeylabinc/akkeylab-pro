# https://medium.com/@Khaptonstall/building-a-static-site-in-swift-using-ignite-and-github-pages-5fa74f3d9b9d
# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - "main"
    paths:
      - "Sources/**"
      - "Assets/**"
      - "Package.resolved"
      - ".github/workflows/static.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app
      - name: Build AkkeyLabPro scheme
        run: xcodebuild -scheme AkkeyLabPro -configuration Release -sdk macosx -destination 'platform=macOS' -derivedDataPath ./DerivedData
      - name: Run AkkeyLabPro App
        run: ./DerivedData/Build/Products/Release/AkkeyLabPro
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Build'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
